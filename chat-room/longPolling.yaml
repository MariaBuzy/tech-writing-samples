openapi: "3.0.0"
info:
    title: "Чат-комната с Long Polling API"
    version: "1.0.0"
security:
  - ApiKeyAuth: []
paths:
    /rooms:
        post:
            summary: Создать новую чат-комнату
            description: Создание новой чат-комнаты по схеме CreateChatRoomRequest. Возвращает ChatRoom.
            requestBody:
                description: Создание новой чат-комнаты по схеме CreateChatRoomRequest
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateChatRoomRequest'
            responses:
                "201":
                    description: Чат-комната создана
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ChatRoom"
                "400":
                    description: Введены некорректные данные
                "500":
                    description: Внутренняя ошибка сервера
    /rooms/{roomId}/participants:
        post:
            summary: Добавить участника в чат-комнату
            description: Добавление существующего участника в указанную чат-комнату по схеме AddParticipantRequest. Ответ по схеме ChatRoom.
            parameters:
                - name: roomId
                  in: path
                  description: ID чат-комнаты
                  required: true
                  schema:
                    type: integer
                    example: 321
            requestBody:
                required: true
                content:
                    application/json: 
                      schema: 
                        $ref: "#/components/schemas/AddParticipantRequest"
            responses:
                "200":
                    description: Участник добавлен в чат-комнату
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ChatRoom"
                "400":
                    description: Введены некорректные данные
                "404":
                    description: Пользователь или чат-комната не найдены
    /rooms/{roomId}/participants/{participantId}:
        delete:
            summary: Удалить пользователя из чат-комнаты
            description: Удаление пользователя из чат-комнаты. Возвращает ответ об успехе/ошибке
            parameters: 
              - name: roomId
                in: path
                description: ID чат-комнаты
                required: true
                schema:
                    type: integer
                    example: 321
              - name: participantId
                in: path
                description: ID пользователя
                required: true
                schema:
                    type: integer
                    example: 123
            responses:
                "204":
                    description: Участник удален из чат-комнаты
                "400":
                    description: Введен некорректный ID чат-комнаты или пользователя
                "404":
                    description: Пользователь или чат-комната не найдены
    /rooms/{roomId}/messages:
        post:
            summary: Отправить сообщение
            description: |
                    Отправка сообщения от аутентифицированного пользователя.
                    Автор определяется по API-ключу и не передается в теле запроса.
                    Пользователь должен быть участником комнаты.
            parameters: 
              - name: roomId
                in: path
                description: ID чат-комнаты
                required: true
                schema:
                    type: integer
                    example: 321
            requestBody:
                required: true
                content:
                    application/json: 
                      schema: 
                        $ref: "#/components/schemas/CreateMessageRequest"
            responses:
                "201":
                    description: Сообщение отправлено
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                "400":
                    description: Введены некорректные данные
                "401":
                    description: Неавторизованный запрос
                "403":
                    description: Пользователь не состоит в комнате
                "404":
                    description: Чат-комната не найдена
        get:
            summary: Long Polling получение новых сообщений
            description: |
             Сервер удерживает соединение открытым до появления новых сообщений
             после указанного времени (since) или до истечения timeoutSeconds.
             Если новые сообщения появляются - возвращается 200 и список сообщений.
             Если за timeoutSeconds новых сообщений нет, то возвращается 204 без тела.
            parameters:
                - name: roomId
                  in: path
                  description: ID чат-комнаты
                  required: true
                  schema:
                    type: integer
                    example: 321
                - name: since
                  in: query
                  description: Дата и время, после которых нужно проверить и получить сообщения, если они есть.
                  required: false
                  schema:
                    type: string
                    format: date-time
                    example: "2026-04-23T12:00:00Z"
                - name: timeoutSeconds
                  in: query
                  required: false
                  description: Максимальное время ожидания новых сообщений
                  schema:
                    type: integer
                    default: 30
                    example: 30
            responses:
                "200":
                    description: Список новых сообщений или пустой массив, если новых сообщений нет
                    content:
                        application/json:
                            schema:
                                type: array
                                items: 
                                    $ref: "#/components/schemas/Message"
                "204":
                    description: Нет новых сообщений за время ожидания                
                "400":
                    description: Введены некорректные данные
                "401":
                    description: Неавторизованный запрос (отсутствует или неверный API-ключ)
                "403":
                    description: Пользователь не является участником комнаты
                "404":
                    description: Чат-комната не найдена

components:
    securitySchemes: 
      ApiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key
        description: API-ключ участника чата. Передаётся в заголовке X-API-Key.

    schemas:
        Participant:
            description: Участник чата
            type: object
            properties:
                id:
                    type: integer
                    readOnly: true
                    example: 1234
                name:
                    type: string
                    example: Борис
            required:
                - id
                - name
        CreateChatRoomRequest:
            description: Создание комнаты
            type: object
            properties:
                name:
                    type: string
                    example: Чат молчунов
            required:
                - name
        ChatRoom:
            type: object
            description: Чат-комната
            properties:
                id:
                    type: integer
                    readOnly: true
                    example: 321
                name:
                    type: string
                    example: Чат молчунов
                participants:
                    type: array
                    items:
                        $ref: '#/components/schemas/Participant'
                    example:
                        - id: 123 
                          name: Борис
            required:
                - id
                - name
        AddParticipantRequest:
            type: object
            description: Добавление участника в чат-комнату
            properties:
                participantId: 
                    type: integer
                    description: ID участника
                    example: 123
            required: 
              - participantId
        CreateMessageRequest:
            type: object
            description: |
                Данные для отправки сообщения.
                Автор определяется на сервере по API-ключу.
            properties:                
                text:
                    type: string
                    description: Текст сообщения
                    example: Hello chat!
            required:
                - text
        Message:
            type: object
            description: Сообщение
            properties: 
              id:
                type: integer
                example: 456
                readOnly: true
              text:
                type: string
                example: Hello chat!
              author:
                $ref: '#/components/schemas/Participant'
              sentAt:
                type: string
                format: date-time
                readOnly: true
            required: 
              - id
              - text              
              - author
              - sentAt
